    <main class="main-formulario">  

        <h2>Registra't</h2>

       <form action="#" method="POST" class="formulariContacte">

            <label for="nom">Nom</label>
            <input class="rellenoFormularioInput" type="text" id="nom" placeholder="Nom" required>

          <label for="correu">Correu electrònic</label>

            <div id="errorCorreu" class="bocadillo-error">
             ⚠ El correu electrònic ha de tenir format usuari@domini.ext
        </div>

            <input class="rellenoFormularioInput"
              type="text"
                id="correu"
              placeholder="Correu electrònic"
              required>

        <label for="contrasenya">Contrasenya</label>

        <div id="errorContrasenya" class="bocadillo-error">
            ⚠ Les contrasenyes no coincideixen
    </div>

        <input class="rellenoFormularioInput"
        type="password"
        id="contrasenya"
        placeholder="Contrasenya"
        required>

        <label for="confirmar-contrasenya">Confirmar Contrasenya</label>

        <input class="rellenoFormularioInput"
       type="password"
       id="confirmar-contrasenya"
       placeholder="Confirmar Contrasenya"
       required>

    <button class="cajitaRegistro" type="submit">
    Registrar-se
</button>

</form>
